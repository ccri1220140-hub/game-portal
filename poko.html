<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぽこぽこパズル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--bg:#fff4d6;--ink:#4a3320;--card:#ffffff;--accent:#ff8a3d;--shadow:#e6c98a;--lock:#d9cfb8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2233;--ink:#fff1dc;--card:#3a2f45;--accent:#ff9a55;--shadow:#1c1523;--lock:#4d4258}}
:root[data-theme="dark"]{--bg:#2b2233;--ink:#fff1dc;--card:#3a2f45;--accent:#ff9a55;--shadow:#1c1523;--lock:#4d4258}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
h1{margin:0;font-size:34px;font-weight:800;color:var(--accent);letter-spacing:.05em}
p{margin:0;font-size:13px}
#pages{display:flex;gap:14px;width:min(92vw,400px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pg{flex:0 0 100%;scroll-snap-align:start}
.pg h3{margin:0 0 8px;font-size:14px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:4px;max-height:56vh;overflow-y:auto}
.st.hard{background:#7a2d4f;color:#fff}.st.hard.now{background:#e0344f}
.st{aspect-ratio:1;font-size:20px;font-weight:800;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--shadow);padding:0;position:relative}
.st.now{background:var(--accent);color:#fff}
.st.lock{background:var(--lock);box-shadow:none;opacity:.7;cursor:not-allowed;font-size:16px}
.st small{position:absolute;bottom:2px;left:0;right:0;font-size:10px}
.hud{display:flex;gap:8px;width:min(94vw,420px)}
.hud div{flex:1;background:var(--card);border-radius:14px;padding:6px 8px;box-shadow:0 3px 0 var(--shadow);text-align:center;font-size:11px}
.hud b{display:block;font-size:20px}
#wrap{position:relative;width:min(94vw,calc((100dvh - 190px)*0.8),420px);aspect-ratio:8/10;background:var(--card);border-radius:20px;padding:5px;box-shadow:0 5px 0 var(--shadow)}
canvas{width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;font-weight:800;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:10px 20px;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}
button.sub{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--shadow)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{min-height:18px;font-size:13px;font-weight:800}
#ov{position:absolute;inset:0;border-radius:20px;background:rgba(40,25,10,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center}
#ov h2{margin:0;font-size:28px}
</style>
</head>
<body>
<div class="screen" id="home">
  <h1>ぽこぽこ</h1>
  <p>ステージをえらんでね</p>
  <div id="pages"></div>
</div>
<div class="screen" id="game" hidden>
  <div class="hud">
    <div>ステージ<b id="hs">1</b></div>
    <div>のこり手数<b id="hm">0</b></div>
    <div>バリア<b id="hb">0</b></div>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="ov" hidden><h2 id="ot"></h2><p id="os"></p><button id="o1"></button><button id="o2" class="sub"></button></div>
  </div>
  <div class="msg" id="msg"></div>
  <div style="display:flex;gap:10px"><button class="sub" id="home-btn">ホーム</button><button class="sub" id="snd">🔊</button></div>
</div>
<script>
const COLS=8,ROWS=10,STAGES=60;
const COL=[{c:"#ff5d5d",d:"#c93a3a"},{c:"#4da3ff",d:"#2a78cf"},{c:"#5fd36f",d:"#37a948"},{c:"#ffd93b",d:"#d1a800"},{c:"#f7f7fb",d:"#b9bccb"}];
const BOMB=[[1,0],[2,0],[-1,0],[-2,0],[0,1],[0,2],[0,-1],[0,-2],[1,1],[1,-1],[-1,1],[-1,-1]];
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cv=$("c"),ctx=cv.getContext("2d");
let grid,bar,moves,stageNo,busy=true,sel=null,parts=[],fx=[],inGame=false,maxStage=1,cleared=0;
let hole,frame,water,vineAt,vines=[],waterHit=false,waterAny=false,hzMsg="";
const lock=(r,c)=>vineAt[r][c]>0||water[r][c];
const mt=(r,c)=>{const p=grid[r][c];return p&&p.k!=="r"&&!water[r][c]&&!(vineAt[r][c]>0)};
const sep=(r,c)=>hole[r][c]||frame[r][c]||vineAt[r][c]>0||water[r][c];
let nClear=0,hClear=0;
try{const a=localStorage.getItem("pk_n"),b=localStorage.getItem("pk_h");
  if(a!==null||b!==null){nClear=Math.min(30,+a||0);hClear=Math.min(30,+b||0)}
  else{const o=+localStorage.getItem("pkpk")||1;nClear=Math.min(30,o-1);hClear=o>30?o-31:0}}catch(e){}
function save(){try{localStorage.setItem("pk_n",nClear);localStorage.setItem("pk_h",hClear)}catch(e){}}
const canPlay=id=>id<=30?id<=nClear+1:(id-30<=hClear+1&&id-30<=Math.max(1,nClear));
const mk=(t,k,y,x)=>({t,k,x,y});
const inb=(r,c)=>r>=0&&c>=0&&r<ROWS&&c<COLS;

/* ---------- home ---------- */
function renderHome(){
  inGame=false;$("game").hidden=true;$("home").hidden=false;
  const box=$("pages");box.innerHTML="";
  [["ノーマル 1〜30　▶ 右へスワイプでハード",0],["🔥 ハード 1〜30",30]].forEach(([t,off])=>{
    const pg=document.createElement("div");pg.className="pg";const h=document.createElement("h3");h.textContent=t;
    if(off){const sm=document.createElement("small");sm.style.cssText="display:block;font-weight:500;font-size:11px";sm.textContent="ノーマルの同じ番号をクリアすると解放";h.append(sm)}
    pg.append(h);
    const g=document.createElement("div"),cl=off?hClear:nClear;g.className="grid";
    for(let i=1;i<=30;i++){
      const id=off+i,b=document.createElement("button");b.className="st"+(off?" hard":"");
      if(!canPlay(id)){b.classList.add("lock");b.textContent="🔒";b.disabled=true}
      else{b.textContent=i;if(i>cl)b.classList.add("now");else{const sm=document.createElement("small");sm.textContent="★";b.append(sm)}
        b.onclick=()=>startStage(id)}
      g.append(b)}
    pg.append(g);box.append(pg)});
  requestAnimationFrame(()=>{box.scrollLeft=stageNo>30?box.scrollWidth:0});
}
$("home-btn").onclick=renderHome;

/* ---------- logic ---------- */
function findMatches(pref,dir){
  const H=[],V=[];
  for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){if(!mt(r,c)){c++;continue}const p=grid[r][c];
    let e=c;while(e+1<COLS&&mt(r,e+1)&&grid[r][e+1].t===p.t)e++;
    if(e-c>=2)H.push({r,a:c,b:e});c=e+1}}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){if(!mt(r,c)){r++;continue}const p=grid[r][c];
    let e=r;while(e+1<ROWS&&mt(e+1,c)&&grid[e+1][c].t===p.t)e++;
    if(e-r>=2)V.push({c,a:r,b:e});r=e+1}}
  const cells=new Set(),sp=new Map();
  H.forEach(h=>{for(let x=h.a;x<=h.b;x++)cells.add(h.r*COLS+x);
    if(h.b-h.a>=4){const ks=[];for(let x=h.a;x<=h.b;x++)ks.push(h.r*COLS+x);sp.set(ks.find(k=>pref.includes(k))??ks[2],"r")}});
  V.forEach(v=>{for(let y=v.a;y<=v.b;y++)cells.add(y*COLS+v.c);
    if(v.b-v.a>=4){const ks=[];for(let y=v.a;y<=v.b;y++)ks.push(y*COLS+v.c);sp.set(ks.find(k=>pref.includes(k))??ks[2],"r")}});
  H.forEach(h=>V.forEach(v=>{if(v.c>=h.a&&v.c<=h.b&&h.r>=v.a&&h.r<=v.b){const k=h.r*COLS+v.c;if(!sp.has(k))sp.set(k,"b")}}));
  H.forEach(h=>{if(h.b-h.a===3){const ks=[0,1,2,3].map(i=>h.r*COLS+h.a+i);if(!ks.some(k=>sp.has(k)))sp.set(ks.find(k=>pref.includes(k))??ks[1],dir||"h")}});
  V.forEach(v=>{if(v.b-v.a===3){const ks=[0,1,2,3].map(i=>(v.a+i)*COLS+v.c);if(!ks.some(k=>sp.has(k)))sp.set(ks.find(k=>pref.includes(k))??ks[1],dir||"v")}});
  return{cells,sp};
}
function hasMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]&&grid[r][c].k==="r")return true;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const[dr,dc]of[[0,1],[1,0]]){
    const nr=r+dr,nc=c+dc;if(!inb(nr,nc))continue;
    if(!grid[r][c]||!grid[nr][nc]||lock(r,c)||lock(nr,nc))continue;
    if(isCombo(grid[r][c],grid[nr][nc]))return true;
    [grid[r][c],grid[nr][nc]]=[grid[nr][nc],grid[r][c]];
    const ok=findMatches([]).cells.size>0;
    [grid[r][c],grid[nr][nc]]=[grid[nr][nc],grid[r][c]];
    if(ok)return true;
  }
  return false;
}
function shuffleBoard(){
  const pos=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c])pos.push([r,c]);
  const ps=pos.map(([r,c])=>grid[r][c]);let n=0;
  do{for(let i=ps.length-1;i>0;i--){const j=rnd(i+1);[ps[i],ps[j]]=[ps[j],ps[i]]}
    pos.forEach(([r,c],i)=>{grid[r][c]=ps[i]});n++}
  while((findMatches([]).cells.size||!hasMove())&&n<300);
}
function refill(){
  for(let c=0;c<COLS;c++){
    let end=ROWS-1;
    while(end>=0){
      if(sep(end,c)){end--;continue}
      let top=end;while(top-1>=0&&!sep(top-1,c))top--;
      const col=[];for(let r=end;r>=top;r--)if(grid[r][c])col.push(grid[r][c]);
      const have=col.length;for(let i=0;i<end-top+1-have;i++)col.push(mk(rnd(5),"n",top-1-i,c));
      for(let r=end,i=0;r>=top;r--,i++)grid[r][c]=col[i];
      end=top-1;
    }
  }
}
function hazards(gone){
  const nb=(r,c)=>[[r+1,c],[r-1,c],[r,c+1],[r,c-1]];let v=0,w=0;
  vines.forEach(vn=>{if(!vn.alive)return;const[tr,tc]=vn.cells[vn.cells.length-1];
    if(gone.has(tr*COLS+tc)||nb(tr,tc).some(([r,c])=>inb(r,c)&&gone.has(r*COLS+c))){
      vn.alive=false;v++;vn.cells.forEach(([r,c])=>{vineAt[r][c]=0;burst(c,r,"#4caf50");burst(c,r,"#9be36a")})}});
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(water[r][c]&&(gone.has(r*COLS+c)||nb(r,c).some(([a,b])=>inb(a,b)&&gone.has(a*COLS+b)))){water[r][c]=false;w++;burst(c,r,"#6ab8ff")}
  if(v)sfx("vine");if(w){waterHit=true;sfx("water")}
}
function growWater(){
  const cand=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(water[r][c])for(const[a,b]of[[r+1,c],[r-1,c],[r,c+1],[r,c-1]])
    if(inb(a,b)&&!hole[a][b]&&!water[a][b]&&grid[a][b]&&!cand.some(x=>x[0]===a&&x[1]===b))cand.push([a,b]);
  if(!cand.length)return;const[a,b]=cand[rnd(cand.length)];water[a][b]=true;burst(b,a,"#6ab8ff");sfx("drip");
}
async function clearSet(cells,sp=new Map()){
  const done=new Set(cells),q=[...cells];let W=150,sA=0,sB=0,sR=0,nBar=0,nHit=0;
  while(q.length){const k=q.pop(),r=Math.floor(k/COLS),c=k%COLS,p=grid[r][c];
    if(vineAt[r][c]>0||water[r][c])continue;
    if(p&&p.k==="r"&&!sp.has(k)){
      const cs=[...new Set(grid.flat().filter(x=>x&&x.k!=="r").map(x=>x.t))];
      if(cs.length){const t=cs[rnd(cs.length)],ks=[];
        for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const o=grid[y][x];
          if(o&&o.k!=="r"&&o.t===t){const nk=y*COLS+x;ks.push(nk);if(!done.has(nk)){done.add(nk);q.push(nk)}}}
        zap(k,ks);sR=1;W=Math.max(W,650)}}
    if(p&&(p.k==="h"||p.k==="v")&&!sp.has(k)){fx.push({t:"arrow",r,c,d:p.k,l:0});W=Math.max(W,500);sA=1;const n=p.k==="h"?COLS:ROWS;for(let i=0;i<n;i++){const nk=p.k==="h"?r*COLS+i:i*COLS+c;if(!done.has(nk)){done.add(nk);q.push(nk)}}}
    if(p&&p.k==="b"&&!sp.has(k)&&(fx.push({t:"boom",r,c,l:0}),W=Math.max(W,420),sB=1,true))for(const[dr,dc]of BOMB){const nr=r+dr,nc=c+dc;if(!inb(nr,nc))continue;fx.push({t:"flash",r:nr,c:nc,l:0});
      const nk=nr*COLS+nc;if(!done.has(nk)){done.add(nk);q.push(nk)}}}
  if(sB)sfx("bomb");if(sA)sfx("arrow");if(sR)sfx("rainbow");if(sA||sB||sR)await sleep(W);
  const gone=new Set();let nFr=0;
  done.forEach(k=>{const r=Math.floor(k/COLS),c=k%COLS,old=grid[r][c];if(!old)return;
    if(vineAt[r][c]>0||water[r][c])return;
    if(frame[r][c]){frame[r][c]=false;nFr++;burst(c,r,"#c98a3a");return}
    gone.add(k);
    if(bar[r][c]>0){bar[r][c]--;bar[r][c]?nHit++:nBar++}
    if(sp.has(k)){grid[r][c]=mk(sp.get(k)==="r"?0:old.t,sp.get(k),old.y,old.x)}
    else{grid[r][c]=null;burst(c,r,COL[old.t].c)}});
  hazards(gone);
  hud();sfx("pop");if(nFr)sfx("frame");if(nBar||nHit)setTimeout(()=>sfx("barrier"),90);await sleep(150);
  refill();await settle();
}
async function resolve(pref){
  while(true){const m=findMatches(pref);pref=[];if(!m.cells.size)break;await clearSet(m.cells,m.sp)}
}
function doSwap(r1,c1,r2,c2){[grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]]}
async function trySwap(r1,c1,r2,c2){
  if(busy)return;sel=null;
  if(!grid[r1][c1]||!grid[r2][c2]||lock(r1,c1)||lock(r2,c2)){msg("そこは動かせないよ");return}
  busy=true;waterHit=false;waterAny=water.some(row=>row.some(Boolean));
  const a=grid[r1][c1],b=grid[r2][c2],k1=r1*COLS+c1,k2=r2*COLS+c2;
  doSwap(r1,c1,r2,c2);await settle();
  if(isCombo(a,b)){
    moves--;await combo(a,b,k1,k2);await resolve([]);
  }else{
    const m=findMatches([k1,k2],r1===r2?"h":"v");
    if(!m.cells.size){doSwap(r1,c1,r2,c2);await settle();msg("そろわないよ");busy=false;return}
    moves--;msg("");
    await clearSet(new Set(m.cells),m.sp);await resolve([]);
  }
  if(waterAny&&!waterHit)growWater();
  hud();checkEnd();
}
function barCount(){return bar.flat().reduce((x,y)=>x+y,0)}
async function checkEnd(){
  if(barCount()===0){
    if(stageNo<=30)nClear=Math.max(nClear,stageNo);else hClear=Math.max(hClear,stageNo-30);save();
    overlay("クリア！","バリアを全部消したよ",(stageNo!==30&&stageNo<60&&canPlay(stageNo+1))?["つぎのステージ",()=>startStage(stageNo+1)]:null,["ホームへ",renderHome]);return}
  if(moves<=0){overlay("ざんねん…","手数がなくなっちゃった",["もういちど",()=>startStage(stageNo)],["ホームへ",renderHome]);return}
  if(!hasMove()){msg("シャッフル！");shuffleBoard();await settle()}
  busy=false;
}
function overlay(t,s,b1,b2){
  $("ot").textContent=t;$("os").textContent=s;
  [["o1",b1],["o2",b2]].forEach(([id,b])=>{const e=$(id);e.hidden=!b;if(b){e.textContent=b[0];e.onclick=()=>{$("ov").hidden=true;b[1]()}}});
  $("ov").hidden=false;
}

/* ---------- stage ---------- */
function startStage(n){
  stageNo=n;$("home").hidden=true;$("game").hidden=false;$("ov").hidden=true;inGame=true;sel=null;parts=[];
  resize();
  grid=[];for(let r=0;r<ROWS;r++){grid.push([]);for(let c=0;c<COLS;c++){let t;
    do{t=rnd(5)}while((c>=2&&grid[r][c-1].t===t&&grid[r][c-2].t===t)||(r>=2&&grid[r-1][c].t===t&&grid[r-2][c].t===t));
    grid[r][c]=mk(t,"n",r-ROWS-1-rnd(3),c)}}
  const mkA=v=>Array.from({length:ROWS},()=>Array(COLS).fill(v));
  bar=mkA(0);fx=[];hole=mkA(false);frame=mkA(false);water=mkA(false);vineAt=mkA(0);vines=[];hzMsg="";
  const R=rng(n*7919+13);
  if(n<=30){
    const nb=Math.min(8+n*2+Math.floor(R()*4),70),cl=[];
    for(let i=0;i<nb;){const r=Math.floor(R()*ROWS),c=Math.floor(R()*COLS);if(!bar[r][c]){bar[r][c]=1;cl.push([r,c]);i++}}
    const nd=n<4?0:Math.min(Math.floor((n-3)*.6+R()*2),nb);
    for(let i=0;i<nd;){const[r,c]=cl[Math.floor(R()*cl.length)];if(bar[r][c]===1){bar[r][c]=2;i++}}
    moves=Math.max(4,Math.round((nb+nd*.6)*Math.max(.2,.8-n*.03))+3);
  }else moves=hardStage(n-30,R);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(hole[r][c])grid[r][c]=null;
  if(!hasMove())shuffleBoard();
  hud();msg(hzMsg||"となりのブロックと入れ替えよう");busy=true;
  settle().then(()=>{busy=false});
}
function hardStage(h,R){
  const NM={vine:"ツタ",frame:"枠",hole:"穴",water:"水"};
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const occ=Array.from({length:ROWS},()=>Array(COLS).fill(false)),pocket=[];
  const rc=()=>[Math.floor(R()*ROWS),Math.floor(R()*COLS)];
  const types=["frame","hole",R()<.5?"vine":"water"];
  if(types.includes("hole")){
    const nh=3+Math.floor(h/3);
    for(let i=0,t=0;i<nh&&t<300;t++){const[r,c]=rc();if(!occ[r][c]){occ[r][c]=true;hole[r][c]=true;i++}}
    if(h>=15)for(let i=0,t=0,np=h>=24?2:1;i<np&&t<300;t++){
      const r=2+Math.floor(R()*(ROWS-4)),c=1+Math.floor(R()*(COLS-2)),ns=[[r,c],[r+1,c],[r-1,c],[r,c+1],[r,c-1]];
      if(ns.some(([a,b])=>occ[a][b]))continue;
      ns.forEach(([a,b],j)=>{occ[a][b]=true;if(j)hole[a][b]=true});pocket.push([r,c]);i++}
  }
  const cand=shuf([].concat(...Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>[r,c]))).filter(([r,c])=>!hole[r][c]&&!pocket.some(q=>q[0]===r&&q[1]===c)));
  const nb=Math.min(12+h*2,62);let L=0;
  [...pocket,...cand].slice(0,Math.max(nb,pocket.length)).forEach(([r,c])=>{
    let v=1;if(R()<Math.min(.7,h*.05))v=2;if(v===2&&h>=5&&R()<Math.min(.6,h*.03+.1))v=3;if(v===3&&h>=12&&R()<Math.min(.5,(h-9)*.03))v=4;
    bar[r][c]=v;L+=v});
  if(types.includes("vine"))for(let i=0,t=0,nv=h>=25?4:3;i<nv&&t<400;t++){
    const[r,c]=rc();if(occ[r][c])continue;

        for(let i=0;i<12;i++){const ang=i*Math.PI/6+k*.4,x1=cx+Math.cos(ang)*L,y1=cy+Math.sin(ang)*L;
          ctx.strokeStyle="hsla("+((i*30+f.l*12)%360)+",100%,60%,"+.75*fade+")";ctx.lineWidth=s*.3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x1,y1);ctx.stroke();
          ctx.strokeStyle="rgba(255,255,255,"+fade+")";ctx.lineWidth=s*.09;ctx.stroke()}
        ctx.restore()}
      if(k>.45){const fl=k<.6?(k-.45)/.15:(k>.8?(1-k)/.2:1);ctx.fillStyle="rgba(255,255,255,"+.85*Math.max(0,fl)+")";ctx.fillRect(0,0,Wd,Ht)}}
    else if(f.t==="zap"){
      const x0=(f.from[1]+.5)*s,y0=(f.from[0]+.5)*s;
      ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.shadowColor="#bdf";ctx.shadowBlur=s*.3;
      f.to.forEach(([tr,tc],i)=>{
        const x1=(tc+.5)*s,y1=(tr+.5)*s;ctx.beginPath();ctx.moveTo(x0,y0);
        for(let j=1;j<7;j++){const u=j/7;ctx.lineTo(x0+(x1-x0)*u+(Math.random()-.5)*s*.5,y0+(y1-y0)*u+(Math.random()-.5)*s*.5)}
        ctx.lineTo(x1,y1);ctx.strokeStyle="hsl("+((i*47+f.l*25)%360)+",100%,65%)";ctx.lineWidth=s*.13;ctx.stroke();
        ctx.strokeStyle="#fff";ctx.lineWidth=s*.04;ctx.stroke();
        ctx.fillStyle="rgba(255,255,255,"+.55*Math.random()+")";rr(tc*s+2,tr*s+2,s-4,s-4,s*.22)});
      ctx.restore()}
  }
}
let AC=null,mute=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f0,f1,d,type,v,delay=0){
  if(!AC||mute)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v,f0,f1){
  if(!AC||mute)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type="lowpass";
  fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(AC.destination);s.start(t)}
function sfx(n){
  if(!AC||mute)return;
  if(n==="pop")tone(520,900,.12,"sine",.25);
  else if(n==="arrow"){noise(.35,.25,3500,400);tone(1400,300,.3,"sawtooth",.07)}
  else if(n==="bomb"){noise(.55,.55,900,60);tone(160,35,.5,"sine",.5)}
  else if(n==="rainbow"){for(let i=0;i<9;i++)tone(500+i*150,700+i*150,.12,"square",.08,i*.06);noise(.7,.2,6000,1500)}
  else if(n==="mega"){for(let i=0;i<14;i++)tone(300+i*130,500+i*160,.14,"sawtooth",.09,i*.05);noise(.9,.25,7000,800);setTimeout(()=>{noise(.6,.5,1500,60);tone(120,30,.6,"sine",.5)},620)}
  else if(n==="vine"){for(let i=0;i<6;i++)setTimeout(()=>noise(.1,.22,5000,1200),i*60)}
  else if(n==="frame"){noise(.14,.4,6000,500);tone(260,70,.14,"square",.18);setTimeout(()=>{noise(.1,.3,4500,400);tone(380,90,.1,"square",.12)},70)}
  else if(n==="water"){tone(1000,350,.16,"sine",.22);tone(1500,500,.14,"sine",.16,.08);tone(800,300,.18,"sine",.12,.16)}
  else if(n==="drip"){tone(1900,750,.1,"sine",.3);tone(500,300,.2,"sine",.1,.06)}
  else if(n==="barrier"){tone(1500,1500,.25,"sine",.18);tone(2100,2100,.3,"sine",.14,.05);noise(.1,.12,6000,6000)}
}
$("snd").onclick=()=>{mute=!mute;$("snd").textContent=mute?"🔇":"🔊";ac()};
