<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マージガーデン</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3e2;--panel:#fbfdf5;--cell:#dfe8cb;--ink:#26331f;--sub:#6b7a5c;--acc:#e0637f;--acc2:#3f8f5b;--line:#c9d6b0;--sel:#f2b632;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17201a;--panel:#212d25;--cell:#2d3d32;--ink:#e8f0dc;--sub:#9fb08f;--acc:#f0839b;--acc2:#6fc48b;--line:#3a4d40;--sel:#f2b632;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17201a;--panel:#212d25;--cell:#2d3d32;--ink:#e8f0dc;--sub:#9fb08f;--acc:#f0839b;--acc2:#6fc48b;--line:#3a4d40;--sel:#f2b632;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;display:flex;justify-content:center;min-height:100vh;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:440px;padding:12px 12px 24px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lv{width:48px;height:48px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.xpw{flex:1}
.xpt{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:3px}
.xpb{height:10px;border-radius:6px;background:var(--cell);overflow:hidden}
.xpb i{display:block;height:100%;background:var(--acc2);transition:width .3s}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.homebtn,.mailbtn{font:inherit;font-weight:900;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 12px;text-decoration:none;position:relative;display:inline-flex;align-items:center;gap:4px}
.bdg{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center}
.wal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.wal div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;font-weight:900;font-size:15px;min-width:0;overflow-wrap:anywhere}
.wal small{color:var(--sub);font-weight:700;font-size:10px;margin-left:3px}
.ord.gift{border-color:var(--sel);background:linear-gradient(180deg,rgba(242,182,50,.18),var(--panel))}
.ord.gift .nm{color:var(--ink);font-weight:700}
.ord.gift.ok{box-shadow:0 0 0 2px var(--sel) inset}
.ord.gift button{background:var(--cell)}
.ord.gift.ok button{background:var(--sel);color:#26331f}
.xpn{font-size:10px;color:var(--sub);margin-top:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{width:100%;max-width:440px;max-height:75vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:16px}
.sh button{border:0;background:var(--cell);color:var(--ink);width:32px;height:32px;border-radius:50%;font:inherit;font-weight:900}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mt{font-weight:900;font-size:13px}.ms{font-size:12px;color:var(--sub);margin-top:2px}
.mi button,.mall{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:900;font-size:12px;background:var(--acc2);color:#fff;flex:none}
.mall{width:100%;margin-top:4px;padding:11px;font-size:13px}
.mall:disabled{opacity:.45}
.mempty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}
.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ord{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center}
.ord .it{font-size:34px;line-height:1.1}
.ord .nm{font-size:11px;color:var(--sub);margin-bottom:4px}
.ord button{width:100%;border:0;border-radius:10px;padding:6px 0;font:inherit;font-weight:700;font-size:12px;background:var(--cell);color:var(--sub)}
.ord.ok{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc2) inset}
.ord.ok button{background:var(--acc2);color:#fff}
.ord.m .it{font-size:24px}.ord.m .nm{font-size:10px}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:var(--panel);padding:8px;border-radius:18px;border:1px solid var(--line);touch-action:none}
.c{aspect-ratio:1;background:var(--cell);border-radius:10px;display:grid;place-items:center;font-size:clamp(22px,7.5vw,34px);position:relative}
.c.sel{outline:3px solid var(--sel);outline-offset:-2px}
.c.hint{outline:2px dashed var(--acc2);outline-offset:-2px}
.c b{position:absolute;right:3px;bottom:1px;font-size:10px;color:var(--sub);font-weight:700}
.c span{pointer-events:none}
.c.pop span{animation:pop .35s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.c.drag span{opacity:.3}
.ghost{position:fixed;pointer-events:none;font-size:42px;transform:translate(-50%,-60%);z-index:9}
.c.lock{background:transparent;border:2px dashed var(--line);opacity:.6;font-size:clamp(16px,5vw,22px)}
.nx{margin-top:8px;text-align:center;font-size:12px;color:var(--sub)}
.en{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.en small{color:var(--sub);font-weight:500;font-size:11px}
.mach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gen{border:0;border-radius:16px;padding:10px 4px;font:inherit;font-weight:900;font-size:13px;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.gen i{font-style:normal;font-size:28px;line-height:1.1}
.gen small{font-weight:500;font-size:10px;opacity:.85}
.gen.f{background:#e08a2e}.gen.v{background:var(--acc2)}
.gen:disabled{opacity:.45}
.gen.locked{background:var(--cell);color:var(--sub);opacity:1}
.rare{margin-top:6px;text-align:center;font-size:11px;color:var(--sub)}
.chain{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.chn{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:3px 0}
.chn em{font-style:normal;font-size:10px;color:var(--sub);width:56px;flex:none}
.msg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;white-space:normal;text-align:center;max-width:calc(100vw - 24px)}
.msg.on{opacity:1}
.rs{margin-top:12px;text-align:center}
.rs button{border:0;background:none;color:var(--sub);font:inherit;font-size:12px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.c.pop span{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <a class="homebtn" id="home" href="ホーム2.html">🏠 ホーム</a>
    <button class="mailbtn" id="mailbtn" type="button">📬 メッセージ<span class="bdg" id="bdg" style="display:none">0</span></button>
  </div>
  <div class="wal">
    <div>🪙 <span id="coin">0</span></div>
    <div>💎 <span id="pt">0</span><small>PT</small></div>
    <div>🔥 <span id="rc">0</span><small>RC</small></div>
  </div>
  <div class="top">
    <div class="lv" id="lv">1</div>
    <div class="xpw"><div class="xpt"><span>経験値</span><span id="xpt"></span></div><div class="xpb"><i id="xpi"></i></div></div>
  </div>
  <div class="orders" id="orders"></div>
  <div class="board" id="board"></div>
  <div class="nx" id="nx"></div>
  <div class="en">⚡ <span id="en"></span><small id="ent"></small></div>
  <div class="mach" id="mach"></div>
  <div class="rare">マシンを押すと 20% で ✨レアが出る！レア同士も合成できる</div>
  <div class="chain" id="chain"></div>
  <div class="rs"><button id="rs">最初からやり直す</button></div>
</div>
<div class="ov" id="ov"><div class="sheet" role="dialog" aria-label="メッセージ">
  <div class="sh"><b>📬 メッセージ</b><button id="mclose" type="button" aria-label="閉じる">✕</button></div>
  <div id="mlist"></div>
  <button class="mall" id="mall" type="button">すべて受け取る</button>
</div></div>
<div class="msg" id="msg"></div>
<script>
const CH=[
 {n:"はな",items:[["たね","🌰"],["芽","🌱"],["草","🌿"],["チューリップ","🌷"],["さくら","🌸"],["バラ","🌹"],["花束","💐"],["ギフト","🎁"]]},
 {n:"くだもの",items:[["さくらんぼ","🍒"],["いちご","🍓"],["ぶどう","🍇"],["みかん","🍊"],["りんご","🍎"],["もも","🍑"],["すいか","🍉"],["パイ","🥧"]]},
 {n:"やさい",items:[["たまねぎ","🧅"],["にんじん","🥕"],["じゃがいも","🥔"],["とうもろこし","🌽"],["トマト","🍅"],["なす","🍆"],["かぼちゃ","🎃"],["シチュー","🍲"]]},
 {n:"✨レア",items:[["四つ葉","🍀"],["きらきら","✨"],["宝石","💎"],["王冠","👑"],["トロフィー","🏆"]]}
];
const RARE=3, RARE_RATE=0.2;
const MACH=[{c:0,label:"たねを出す",icon:"🌰",cls:"",lv:1},{c:1,label:"くだもの",icon:"🍒",cls:"f",lv:5},{c:2,label:"やさい",icon:"🥕",cls:"v",lv:15}];
const UNLOCK_LV=[5,15,30,50,70], UNLOCK_N=[5,5,5,5,4], START_OPEN=24; // 下2行(24〜35)から開始
const N=36, EMAX=100, REGEN=120000, KEY="mergeGarden2"; // エネルギー回復：2分で1
const GIFT_EVERY=5, GIFT_COIN=1000, GIFT_REQ={c:0,lv:8}; // 5レベルごと：花の最終形(🎁)を確定オーダー
const MULTI_XP=1.5; // 複数オーダーのXP倍率
const HOME_URL="home.html.html";
// ホームと共通の保存キー
const WK="ridokaji_wallet_v1", CK="ridokaji_cards_v1";
function rawWallet(){try{const w=JSON.parse(localStorage.getItem(WK));if(w&&typeof w==="object")return w}catch(e){}return {coin:1000,pt:0}}
function getWallet(){const w=rawWallet();return {coin:Math.max(0,Math.floor(+w.coin||0)),pt:Math.max(0,Math.floor(+w.pt||0))}}
function addCoin(n){if(!(n>0))return;const w=rawWallet();w.coin=Math.max(0,Math.floor(+w.coin||0))+n;try{localStorage.setItem(WK,JSON.stringify(w))}catch(e){}}
function totalRC(){try{const c=JSON.parse(localStorage.getItem(CK));return Array.isArray(c)?c.reduce((a,x)=>a+Math.max(0,Math.floor(+x.rc||0)),0):0}catch(e){return 0}}
const mk=(c,l)=>(c+1)*10+l, cOf=v=>Math.floor(v/10)-1, lOf=v=>v%10;
const itm=v=>CH[cOf(v)].items[lOf(v)-1], maxLv=v=>CH[cOf(v)].items.length;
let S, drag=null, sel=-1, machSig="", mailSig=null;
const $=id=>document.getElementById(id);
function extraOpen(lv=S.lvl){let n=0;UNLOCK_LV.forEach((t,k)=>{if(lv>=t)n+=UNLOCK_N[k]});return n}
function isOpen(i){return i>=START_OPEN||(START_OPEN-1-i)<extraOpen()}
function lockLv(i){const k=START_OPEN-1-i;let c=0;for(let s=0;s<UNLOCK_LV.length;s++){c+=UNLOCK_N[s];if(k<c)return UNLOCK_LV[s]}return 0}
function fresh(){const b=Array(N).fill(0);[mk(0,1),mk(0,1),mk(0,1),mk(0,2),mk(0,2),mk(0,3)].forEach((v,i)=>b[24+i]=v);
  return {b,e:EMAX,et:Date.now(),xp:0,txp:0,lvl:1,orders:[],giftQ:0,mail:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);if(S.txp==null)S.txp=0;if(!S.orders||S.orders.some(o=>!o.need))S.orders=[];
    if(!Array.isArray(S.mail))S.mail=[];if(!(S.giftQ>0))S.giftQ=0;
    if(S.coin>0){addCoin(S.coin)}delete S.coin; // 旧データのコインをホームの財布へ移行
    return}}catch(e){}S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function xpNeed(){return S.lvl*40+20}
function avail(){return MACH.filter(m=>S.lvl>=m.lv).map(m=>m.c)}
function newReq(){const cs=avail();const hi=Math.min(7,2+Math.floor(S.lvl/2));
  if(Math.random()<.12)return {c:RARE,lv:2+Math.floor(Math.random()*2)};
  return {c:cs[Math.floor(Math.random()*cs.length)],lv:2+Math.floor(Math.random()*(hi-1))}}
function newOrder(){let k=1;if(S.lvl>=5&&Math.random()<.45)k=Math.random()<.65?2:3;
  const need=[];let t=0;while(need.length<k&&t++<60){const r=newReq();if(!need.some(x=>x.c===r.c&&x.lv===r.lv))need.push(r)}return {need}}
const mult=r=>r.c===RARE?2:1;
const rewardCoin=o=>o.gift?GIFT_COIN:o.need.reduce((a,r)=>a+r.lv*r.lv*4*mult(r),0);
const rewardXp=o=>{const base=o.need.reduce((a,r)=>a+r.lv*10*mult(r),0);return o.need.length>=2?Math.floor(base*MULTI_XP):base};
function giftOrder(){return {need:[{...GIFT_REQ}],gift:true}}
function fillOrders(){while(S.orders.length<3){if(S.giftQ>0){S.orders.push(giftOrder());S.giftQ--}else S.orders.push(newOrder())}}
function injectGifts(){while(S.giftQ>0){
  if(S.orders.length<3){S.orders.push(giftOrder());S.giftQ--;continue}
  const done=o=>o.need.every(r=>S.b.includes(mk(r.c,r.lv)));
  let idx=-1;for(let k=S.orders.length-1;k>=0;k--){if(!S.orders[k].gift&&!done(S.orders[k])){idx=k;break}}
  if(idx<0)for(let k=S.orders.length-1;k>=0;k--){if(!S.orders[k].gift){idx=k;break}}
  if(idx<0)break;S.orders[idx]=giftOrder();S.giftQ--}}
function toast(t){const m=$("msg");m.textContent=t;m.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>m.classList.remove("on"),1400)}
function regen(){const now=Date.now();if(S.e>=EMAX){S.et=now;return}
  const n=Math.floor((now-S.et)/REGEN);if(n>0){S.e=Math.min(EMAX,S.e+n);S.et+=n*REGEN;if(S.e>=EMAX)S.et=now}}
function gain(xp,coin){const bl=S.lvl;S.xp+=xp;S.txp+=xp;addCoin(coin);const msgs=[];
  while(S.xp>=xpNeed()){S.xp-=xpNeed();S.lvl++;
    S.mail.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:"🎉 レベル"+S.lvl+" 到達ボーナス",amt:EMAX,t:Date.now()});
    msgs.push("🎉 レベル"+S.lvl+"！ 📬スタミナ"+EMAX+"が届いたよ");
    if(S.lvl%GIFT_EVERY===0){S.giftQ++;msgs.push("🎁 レベル"+S.lvl+"記念！ギフトの特別オーダー（🪙"+GIFT_COIN+"）")}}
  injectGifts();
  UNLOCK_LV.forEach((t,k)=>{if(bl<t&&S.lvl>=t){let m="🔓 マスが"+UNLOCK_N[k]+"つ解放！";
    if(k===0)m+=" 🍒くだものマシン登場";if(k===1)m+=" 🥕やさいマシン登場";msgs.push(m)}});
  if(bl<5&&S.lvl>=5)msgs.push("📦 まとめオーダー登場！");
  msgs.forEach((m,i)=>setTimeout(()=>toast(m),(i+1)*1500))}
function fmtT(sec){return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}
function renderMail(){const n=S.mail.length;$("bdg").textContent=n;$("bdg").style.display=n?"":"none";
  const sig=S.mail.map(m=>m.id).join();if(sig===mailSig)return;mailSig=sig;
  $("mlist").innerHTML=n?S.mail.slice().reverse().map(m=>'<div class="mi"><div><div class="mt">'+m.title+'</div><div class="ms">⚡ スタミナ '+m.amt+'</div></div><button type="button" data-id="'+m.id+'">受け取る</button></div>').join(""):'<div class="mempty">メッセージはありません</div>';
  $("mall").disabled=!n}
function claimMail(id){regen();const list=id==null?S.mail.slice():S.mail.filter(m=>m.id===id);if(!list.length)return;
  const amt=list.reduce((a,m)=>a+m.amt,0);S.e+=amt;S.mail=S.mail.filter(m=>!list.includes(m));
  if(S.e>=EMAX)S.et=Date.now();machSig="";toast("⚡ スタミナ +"+amt+" 受け取った！");render()}
function render(pop){
  $("lv").textContent=S.lvl;const w=getWallet();$("coin").textContent=w.coin.toLocaleString("ja-JP");$("pt").textContent=w.pt.toLocaleString("ja-JP");$("rc").textContent=totalRC().toLocaleString("ja-JP");renderMail();
  $("xpt").textContent=S.xp+" / "+xpNeed();$("xpi").style.width=(S.xp/xpNeed()*100)+"%";
  $("en").textContent=S.e+" / "+EMAX;
  $("ent").textContent=S.e>=EMAX?(S.e>EMAX?"満タン超え！":"満タン"):"次の+1まで "+fmtT(Math.max(0,Math.ceil((REGEN-(Date.now()-S.et))/1000)));
  const nt=UNLOCK_LV.find(t=>S.lvl<t);
  $("nx").textContent=nt?"次のマス解放：レベル"+nt+"（あと"+(nt-S.lvl)+"）":"すべてのマスを解放済み 🎉";
  // マシン
  const sig=avail().join()+"|"+(S.e<1)+"|"+S.lvl;
  if(sig!==machSig){machSig=sig;$("mach").innerHTML=MACH.map(m=>{const ok=S.lvl>=m.lv;
    return ok?'<button class="gen '+m.cls+'" data-c="'+m.c+'"'+(S.e<1?" disabled":"")+'><i>'+m.icon+'</i>'+m.label+'<small>⚡1</small></button>'
    :'<button class="gen locked" disabled><i>🔒</i>Lv'+m.lv+'で解放</button>'}).join("")}
  // ボード
  const bd=$("board");bd.innerHTML="";
  S.b.forEach((v,i)=>{const d=document.createElement("div");
    if(!isOpen(i)){d.className="c lock";d.dataset.i=i;d.innerHTML="<span>🔒</span><b>Lv"+lockLv(i)+"</b>";bd.appendChild(d);return}
    d.className="c"+(i===sel?" sel":"")+(pop===i?" pop":"")+(drag&&drag.on&&drag.from===i?" drag":"");d.dataset.i=i;
    if(v){d.innerHTML="<span>"+itm(v)[1]+"</span><b>"+lOf(v)+"</b>"}bd.appendChild(d)});
  // 注文
  const od=$("orders");od.innerHTML="";
  S.orders.forEach((o,k)=>{const its=o.need.map(r=>CH[r.c].items[r.lv-1]);const ok=o.need.every(r=>S.b.includes(mk(r.c,r.lv)));
    const d=document.createElement("div");d.className="ord"+(ok?" ok":"")+(o.need.length>1?" m":"")+(o.gift?" gift":"");
    const xn=o.gift?"記念ギフト ⭐"+rewardXp(o):"⭐"+rewardXp(o)+" XP"+(o.need.length>1?"(×"+MULTI_XP+")":"");
    d.innerHTML='<div class="nm">'+(o.gift?"🎁 ":"")+its.map(x=>x[0]).join("＋")+'</div><div class="it">'+its.map(x=>x[1]).join("")+'</div><button data-k="'+k+'">'+(ok?"届ける":"🪙 "+rewardCoin(o).toLocaleString("ja-JP"))+'</button><div class="xpn">'+xn+'</div>';od.appendChild(d)});
  // チェーン一覧
  $("chain").innerHTML=CH.map((c,k)=>{if(k<RARE&&!avail().includes(k))return"";
    return '<div class="chn"><em>'+c.n+'</em>'+c.items.map(x=>x[1]).join("<span style='color:var(--sub);font-size:12px'>›</span>")+'</div>'}).join("");
  save()}
function act(a,b){if(a===b||!S.b[a]||!isOpen(a)||!isOpen(b))return false;const va=S.b[a],vb=S.b[b];
  if(!vb){S.b[b]=va;S.b[a]=0;render(b);return true}
  if(va===vb&&lOf(va)<maxLv(va)){S.b[b]=va+1;S.b[a]=0;gain(lOf(va),0);render(b);return true}
  S.b[a]=vb;S.b[b]=va;render(b);return true}
function cellAt(x,y){const el=document.elementFromPoint(x,y);const c=el&&el.closest&&el.closest(".c");return c?+c.dataset.i:-1}
const bd=$("board");
bd.addEventListener("pointerdown",e=>{const c=e.target.closest(".c");if(!c)return;const i=+c.dataset.i;if(!isOpen(i))return;
  drag={from:i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId}});
window.addEventListener("pointermove",e=>{if(!drag||!S.b[drag.from])return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.on=true;sel=-1;
    const g=document.createElement("div");g.className="ghost";g.id="ghost";g.textContent=itm(S.b[drag.from])[1];document.body.appendChild(g);render()}
  if(drag.on){const g=$("ghost");g.style.left=e.clientX+"px";g.style.top=e.clientY+"px"}});
window.addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;const g=$("ghost");if(g)g.remove();
  if(d.on){const t=cellAt(e.clientX,e.clientY);if(t>=0)act(d.from,t);else render();return}
  const i=d.from;
  if(sel<0){if(S.b[i])sel=i;render()}
  else if(sel===i){sel=-1;render()}
  else{const s=sel;sel=-1;if(!act(s,i))render()}});
window.addEventListener("pointercancel",()=>{drag=null;const g=$("ghost");if(g)g.remove();render()});
$("mach").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled||b.dataset.c==null)return;const c=+b.dataset.c;
  regen();if(S.e<1)return toast("エネルギーが足りません");
  const free=S.b.map((v,i)=>(!v&&isOpen(i))?i:-1).filter(i=>i>=0);if(!free.length)return toast("ボードがいっぱい！合成しよう");
  const i=free[Math.floor(Math.random()*free.length)];
  if(Math.random()<RARE_RATE){S.b[i]=mk(RARE,1);toast("✨ レア排出！ "+CH[RARE].items[0][1])}
  else S.b[i]=mk(c,(S.lvl>=3&&Math.random()<.15)?2:1);
  if(S.e>=EMAX)S.et=Date.now();S.e--;render(i)};
$("orders").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=+b.dataset.k,o=S.orders[k];
  const idx=o.need.map(r=>S.b.indexOf(mk(r.c,r.lv)));
  if(idx.some(i=>i<0)){const r=o.need[idx.findIndex(i=>i<0)];return toast("まだ"+CH[r.c].items[r.lv-1][0]+"がありません")}
  idx.forEach(i=>S.b[i]=0);sel=-1;S.orders.splice(k,1);const c=rewardCoin(o),x=rewardXp(o);gain(x,c);fillOrders();toast("+🪙"+c.toLocaleString("ja-JP")+"  +"+x+"XP");render()};
$("rs").onclick=()=>{if(confirm("ゲームの進行を最初からやり直しますか？\n（コイン・PT・RCはホームに残ります）")){S=fresh();fillOrders();sel=-1;machSig="";mailSig=null;render()}};
$("mailbtn").onclick=()=>{mailSig=null;renderMail();$("ov").classList.add("on")};
$("mclose").onclick=()=>$("ov").classList.remove("on");
$("ov").onclick=e=>{if(e.target===$("ov"))$("ov").classList.remove("on")};
$("mlist").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.id)claimMail(b.dataset.id)};
$("mall").onclick=()=>claimMail(null);
$("home").href=HOME_URL;
window.addEventListener("pageshow",()=>{if(S)render()});
load();if(!S.orders||!S.orders.length)S.orders=[];fillOrders();regen();render();
setInterval(()=>{regen();if(!drag)render()},1000);
</script>
</body>
