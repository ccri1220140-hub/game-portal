<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>倍倍チャンス</title>
<style>
:root{--bg:#f6f1e7;--fg:#1d1a2b;--card:#fff;--ac:#d6336c;--ac2:#f59f00;--mut:#6b6880;--ln:#e3dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112b;--fg:#f4f0ff;--card:#241d47;--ac:#ff5c93;--ac2:#ffc933;--mut:#a9a2cf;--ln:#3a3068}}
:root[data-theme="dark"]{--bg:#15112b;--fg:#f4f0ff;--card:#241d47;--ac:#ff5c93;--ac2:#ffc933;--mut:#a9a2cf;--ln:#3a3068}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:500}
.v{display:none;max-width:520px;margin:0 auto;padding:14px}.v.on{display:block}
h1{font-size:26px;margin:4px 0 12px;font-weight:900}h2{font-size:20px;margin:6px 0 10px;font-weight:900}
.card{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.wal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wal div{background:var(--bg);border-radius:10px;padding:8px;font-size:13px;color:var(--mut)}
.wal b{display:block;font-size:20px;color:var(--fg)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:var(--ac2);color:#2a1d00}button.g{background:var(--ln);color:var(--fg)}button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid4 button{padding:16px 6px}
small{color:var(--mut);font-size:12px}
.cl{max-height:200px;overflow:auto;font-size:13px}.cl div{padding:4px 0;border-bottom:1px solid var(--ln)}
.en{display:flex;gap:4px;margin:10px 0}.en div{flex:1;text-align:center;background:var(--card);border:3px solid var(--ln);border-radius:12px;padding:8px 2px;font-size:11px;min-height:112px}
.en div.sel{border-color:var(--ac);transform:translateY(-4px)}.en i{display:block;font-size:34px;font-style:normal}
.en em{display:block;font-style:normal;font-weight:900;margin-top:6px;font-size:14px}.ok{color:#2f9e44}.ng{color:#e03131}
.star{position:relative;width:310px;height:300px;margin:6px auto}
.sl{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--card);border:3px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;line-height:1.2;padding:2px}
.sl i{font-style:normal;font-size:24px}.sl.k{border-color:var(--ac2);box-shadow:0 0 14px var(--ac2)}
.sl.k::after{content:"keep";position:absolute;bottom:-9px;background:var(--ac2);color:#2a1d00;font-weight:900;font-size:11px;padding:1px 8px;border-radius:8px}
.big{font-size:22px;padding:16px;width:100%}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,6,30,.88);color:#fff;text-align:center;padding:20px}.ov.on{display:flex}
.box{background:var(--card);color:var(--fg);padding:20px;border-radius:16px;width:100%;max-width:340px}
#bt{flex-direction:column;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.stg{position:relative;width:100%;max-width:420px;height:230px;border-radius:14px;background:linear-gradient(#3b2a7a,#1a1240);overflow:hidden;margin-top:6px}
.ch{position:absolute;bottom:26px;font-size:68px;transition:transform .2s}.ch span{display:block;font-size:11px;text-align:center}
#me{left:22px}#rid{right:22px}
.hp{position:absolute;top:8px;width:42%;height:10px;background:#0006;border-radius:6px;overflow:hidden}.hp b{display:block;height:100%;width:100%;background:#51cf66;transition:width .5s}
#hr{right:8px}#hm{left:8px}
#msg{margin:14px 0;font-size:19px;font-weight:900;min-height:56px}
#cut{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:34px;font-weight:900;background:linear-gradient(100deg,#0000,#ff2d6faa 40%,#ffc933aa 60%,#0000);color:#fff;text-shadow:0 0 12px #000;animation:cin .7s}
@keyframes cin{from{transform:translateX(-100%)}to{transform:none}}
@keyframes lg{50%{transform:translateX(70px)}}@keyframes lgr{50%{transform:translateX(-70px)}}
@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes dg{50%{transform:translateY(-60px) rotate(-30deg)}}
.lg{animation:lg .5s}.lr{animation:lgr .5s}.sk{animation:sk .4s}.dg{animation:dg .6s}
@keyframes pu{50%{transform:scale(1.12)}}.pu{animation:pu 1s infinite}
.cf{font-size:30px;letter-spacing:6px;animation:pu 1.2s infinite}
.gold{background:linear-gradient(135deg,#ffd43b,#f08c00);color:#2a1d00}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.stg{height:260px;background:linear-gradient(#1c1245,#6b2a68 68%,#201530 68%)}
#flr{position:absolute;left:0;right:0;bottom:0;height:46px;background:#1b1230;border-top:3px solid #ff5c93}
.ch{bottom:36px;font-size:72px}.ch span{color:#fff}
.hp{width:44%;height:16px;top:8px}.hp u{position:absolute;inset:0;font-size:10px;text-decoration:none;text-align:center;line-height:16px;color:#fff;font-weight:900}
#fx{position:absolute;inset:0;pointer-events:none}
.dn{position:absolute;font-weight:900;font-size:30px;color:#fff;text-shadow:0 0 4px #000,2px 2px 0 #e03131;animation:dn 1s forwards}
@keyframes dn{from{transform:translateY(0) scale(.5)}20%{transform:translateY(-10px) scale(1.3)}to{transform:translateY(-60px) scale(1);opacity:0}}
.im{position:absolute;font-size:56px;animation:im .45s forwards}@keyframes im{from{transform:scale(.3) rotate(-20deg)}to{transform:scale(1.5) rotate(10deg);opacity:0}}
.sh{position:absolute;height:5px;width:150px;background:linear-gradient(90deg,#0000,#fff,#0000);box-shadow:0 0 10px #fff;animation:sh .3s forwards}@keyframes sh{from{transform:rotate(var(--r)) scaleX(0)}to{transform:rotate(var(--r)) scaleX(1.3);opacity:0}}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}#fl.on{animation:fl .35s}@keyframes fl{from{opacity:.9}to{opacity:0}}
.shk{animation:shk .35s}@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}}
#tb{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:24px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 10px #ff5c93;opacity:0}
#tb.on{animation:tb 1.2s}@keyframes tb{0%{opacity:0;transform:translateX(-60px)}20%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(60px)}}
.star{width:340px;height:320px}.sl{width:96px;height:96px;margin:-48px 0 0 -48px}.sl b{font-size:21px;line-height:1.1}.sl i{font-size:22px}
.sl.hi{border-color:#ffd43b}.sl.rl{animation:sk .15s infinite;filter:blur(1px)}
#tot{text-align:center;font-size:22px;font-weight:900;margin:2px 0 12px;min-height:30px}
.rb{background:linear-gradient(120deg,#ff0050,#ffd43b,#40c057,#339af0,#cc5de8,#ff0050);background-size:300% 300%;animation:rbm 2s linear infinite}@keyframes rbm{to{background-position:300% 0}}
.rbt{background:linear-gradient(90deg,#ff0050,#ffd43b,#40c057,#339af0,#cc5de8,#ff0050);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rbm 1.5s linear infinite,pu .6s infinite}.en em{font-size:17px}
.hd{background:radial-gradient(circle at 50% 0,#6a3ad8,#1a1240 70%);border:3px solid #ffd43b;border-radius:16px;padding:16px 10px;text-align:center;color:#fff;margin:10px 0;box-shadow:0 0 28px #ffd43b66}
.hd .ttl{font-size:26px;font-weight:900;background:linear-gradient(90deg,#ffd43b,#fff,#ffd43b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rbm 2.5s linear infinite}
.mult{font-size:76px;font-weight:900;color:#ffd43b;text-shadow:0 0 24px #f08c00;line-height:1.1;animation:pu .8s infinite}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:106px;margin:10px 0 2px}.bars div{position:relative;width:44px;border-radius:8px 8px 0 0;background:linear-gradient(#ffd43b,#f08c00);animation:grow .9s backwards}
.bars span{position:absolute;top:-19px;left:0;right:0;font-weight:900;font-size:13px;color:#ffd43b}@keyframes grow{from{height:0}}
.bl{display:flex;justify-content:center;gap:8px;font-size:11px}.bl span{width:44px}.hd .tk{margin:10px 0;font-size:15px}
</style></head><body>

<div class="v on" id="v-dbl">
<button class="g" onclick="location.href=HOME_URL">← ホーム</button> <button class="g" id="mt" onclick="toggleMute()">🔊 音ON</button>
<h2>倍倍チャンス</h2>
<div id="d-ready" class="hd"><div class="ttl">倍になるかも…！？</div><div class="mult" id="mult">×2</div>
<div style="font-size:13px">同じ報酬がそろうほど、ぜんぶ倍々！</div>
<div class="bars"><div style="height:4px"><span>1</span></div><div style="height:16px"><span>4</span></div><div style="height:36px"><span>9</span></div><div style="height:64px"><span>16</span></div><div style="height:100px"><span>25</span></div></div><div class="bl"><span>1つ</span><span>2つ</span><span>3つ</span><span>4つ</span><span>5つ</span></div>
<div style="font-size:15px;font-weight:900;margin:10px 0">5つそろえば <span style="color:#ffd43b;font-size:24px">25個ぶん</span>！？</div>
<div style="font-size:11px;color:#d7ccff">例：5000コイン×4つ ＝ 16個 ＝ 80,000コイン</div>
<div class="tk">🎟 所持 <b id="tkn">0</b> 枚</div>
<button class="big" onclick="useTicket('dt','倍倍チャンス',startDbl)">🎟 チケットを使ってチャンスに挑む！</button></div>
<div id="d-play" style="display:none">
<p style="text-align:center;margin:0">残りスピン <b id="left">4</b>回　<small>枠をタップでkeep</small></p>
<div class="star" id="star"></div><div id="tot"></div>
<button class="big" id="spin" onclick="spin()">SPIN</button>
<button class="g" style="width:100%;margin-top:10px" id="stop" onclick="finishDbl()">ここで終わる</button>
<div id="d-end" style="display:none;margin-top:10px" class="row"><button onclick="go('dbl')">もう一度引く</button><button class="g" onclick="location.href=HOME_URL">ホームに戻る</button></div>
</div></div>


<div class="ov" id="cf"><div id="cfb"></div></div>
<div class="ov" id="cm"><div class="box"><p id="cmt" style="font-size:17px;font-weight:900"></p><p id="cmn" style="font-size:26px;margin:6px 0 16px"></p><div class="row"><button class="g" id="cmx">キャンセル</button><button id="cmo">確認</button></div></div></div>
<div class="ov" id="bt"><div class="stg" id="stg"><div class="hp" id="hm"><b></b><u></u></div><div class="hp" id="hr"><b></b><u></u></div><div id="flr"></div><div class="ch" id="me">🧑‍🎤<span>あなた</span></div><div class="ch" id="rid">😎<span>リドナ（主催）</span></div><div id="fx"></div><div id="cut"></div><div id="fl"></div><div id="tb"></div></div>
<div id="msg"></div><button class="g" onclick="fast=true">スキップ</button></div>
<div class="ov" id="rs"><div class="box"><div id="rsb"></div><button style="margin-top:14px;width:100%" onclick="$('#rs').classList.remove('on')">閉じる</button></div></div>

<script>
const $=s=>document.querySelector(s);let fast=false;
const K={w:'ridokaji_wallet_v1',c:'ridokaji_cards_v1',t:'ridokaji_tickets_v1'},HOME_URL='home.html';
const rd=(k,d)=>{try{const x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S={coin:0,pt:0,rc:0,bt:0,dt:0};
function load(){const w=rd(K.w,{coin:1000,pt:0}),t=rd(K.t,{bt:0,dt:0});S.coin=Math.max(0,Math.floor(+w.coin||0));S.pt=Math.max(0,Math.floor(+w.pt||0));S.bt=+t.bt||0;S.dt=+t.dt||0;
S.rc=rd(K.c,[]).reduce((a,c)=>a+Math.max(0,Math.floor(+c.rc||0)),0)}
function save(){const w=rd(K.w,{coin:1000,pt:0});w.coin=S.coin;w.pt=S.pt;wr(K.w,w);wr(K.t,{bt:S.bt,dt:S.dt});render()}
const sleep=ms=>new Promise(r=>setTimeout(r,fast?ms/8:ms));
const fmt=n=>n.toLocaleString();
function addCard(o){const cs=rd(K.c,[]);cs.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:new Date().toLocaleString('ja-JP')},o));wr(K.c,cs);if(o.rc)S.rc+=o.rc}
/* ===== 音 ===== */
let AC,mute=rd('tg_mute',false);
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function toggleMute(){mute=!mute;wr('tg_mute',mute);$('#mt').textContent=mute?'🔇 音OFF':'🔊 音ON'}
function tone(f,d,ty='sine',v=.15,t0=0,f2){const a=ac();if(!a||mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.2,t0=0,hp=800){const a=ac();if(!a||mute)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}
function fan(n,d,v=.2){n.forEach((f,i)=>{tone(f,d*2.5,'square',v*.5,i*d);tone(f*2,d*2.5,'triangle',v*.6,i*d)})}
const SF={tick:()=>tone(900+Math.random()*300,.04,'square',.05),stop:n=>{tone(300+n*110,.18,'triangle',.25);noise(.06,.1)},
hit:()=>{noise(.15,.3);tone(140,.18,'sine',.35,0,50)},crit:()=>{noise(.3,.4,0,300);tone(90,.4,'sawtooth',.35,0,30);tone(1200,.15,'square',.1)},
whoosh:()=>noise(.25,.14,0,2500),turn:()=>{tone(300,.3,'sawtooth',.1,0,900);noise(.2,.1,0,2000)},zap:()=>{for(let k=0;k<8;k++)tone(200+Math.random()*1500,.08,'sawtooth',.1,k*.06)},
ko:()=>tone(400,.8,'sawtooth',.2,0,50),cut:()=>{noise(.5,.3,0,200);tone(60,.6,'sawtooth',.3,0,40);tone(300,.5,'square',.08,0,1500)},charge:()=>{tone(150,1.2,'sawtooth',.15,0,1200)},
ok:()=>fan([523,659,784,1047],.07),ng:()=>{tone(300,.3,'sawtooth',.2,0,120);tone(220,.4,'square',.1,.15,90)},
win:()=>fan([523,659,784,1047,784,1047,1319],.12),lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.4,'triangle',.2,i*.25))},
big:()=>fan([523,659,784,1047,1319,1047,1319,1568],.1),big2:()=>{fan([392,523,659,784,1047,1319,1568,2093],.09);noise(.6,.3,0,300)},
boom:()=>{noise(.5,.35,0,150);tone(80,.6,'sine',.4,0,30)},pop:()=>{noise(.2,.14,0,500);tone(220,.2,'sine',.2,0,60)},
mega:()=>{[0,1200,2400,3600].forEach(d=>setTimeout(()=>{fan([523,659,784,1047,1319,1568,2093,1568,2093],.09);SF.boom()},d))}};
let fwRaf;
function fireworks(){const c=$('#fwc'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let ps=[],t=0,n=0;
function burst(){const cx=Math.random()*c.width,cy=Math.random()*c.height*.6+40,h=Math.random()*360;for(let i=0;i<70;i++){const a=Math.PI*2*i/70,sp=2+Math.random()*5;ps.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,h})}if(n++%2==0)SF.pop()}
(function f(){x.fillStyle='rgba(10,6,30,.22)';x.fillRect(0,0,c.width,c.height);if(t++%12==0)burst();ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l-=.011;x.fillStyle=`hsla(${p.h},100%,60%,${p.l})`;x.fillRect(p.x,p.y,4,4)});ps=ps.filter(p=>p.l>0);fwRaf=requestAnimationFrame(f)})()}
function go(v){document.querySelectorAll('.v').forEach(e=>e.classList.remove('on'));$('#v-'+v).classList.add('on');
if(v=='body'){$('#b-ready').style.display='';$('#b-play').style.display='none'}
if(v=='dbl'){$('#d-ready').style.display='';$('#d-play').style.display='none';$('#d-end').style.display='none'}
render();scrollTo(0,0)}
function render(){const n=$('#tkn');if(n)n.textContent=S.dt}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function roll(L){let t=L.reduce((a,x)=>a+x.w,0),r=Math.random()*t;for(const x of L){if((r-=x.w)<0)return x}return L[L.length-1]}
function confirmBox(t,n,ok){$('#cmt').textContent=t;$('#cmn').textContent=n;$('#cm').classList.add('on');
$('#cmx').onclick=()=>$('#cm').classList.remove('on');$('#cmo').onclick=()=>{SF.ok();$('#cm').classList.remove('on');ok()}}
function useTicket(k,name,ok){if(S[k]<1){alert('チケットがありません');return}
confirmBox(name+'チケットを使用します',`${S[k]}→${S[k]-1}枚`,()=>{S[k]--;save();ok()})}
function celeb(t,sub,big,lv){return new Promise(r=>{const o=$('#cf'),m=lv==3;o.className='ov'+(lv==1?' rb':'');
$('#cfb').innerHTML=(m?'<canvas id="fwc" style="position:fixed;inset:0;width:100%;height:100%"></canvas>':'')+`<div style="position:relative"><div class="cf">${m?'👑🎆🎇🎆👑':big?'🎆✨🎇✨🎆':'🎉✨🎊'}</div><div class="pu${m?' rbt':''}" style="font-size:${m?42:big?34:28}px;font-weight:900;margin:16px 0;${big&&!m?'color:#ffd43b;text-shadow:0 0 20px #f08c00':''}">${t}</div><div style="font-size:${m?20:16}px">${sub||''}</div><small style="display:block;margin-top:20px;color:#fff9">タップで閉じる</small></div>`;
o.classList.add('on');(m?SF.mega:lv?SF.big2:big?SF.big:SF.ok)();if(m)fireworks();
let can=!m;setTimeout(()=>can=true,m?3500:0);
o.onclick=()=>{if(!can)return;cancelAnimationFrame(fwRaf);o.classList.remove('on');r()}})}

/* ===== 倍倍チャンス ===== */
const P=[{n:'1000コイン',w:50,c:1000,i:'🪙',v:'1,000',u:'コイン'},{n:'3000コイン',w:25,c:3000,i:'🪙',v:'3,000',u:'コイン'},{n:'5000コイン',w:17,c:5000,i:'🪙',v:'5,000',u:'コイン'},{n:'10000コイン',w:7,c:10000,i:'🪙',v:'10,000',u:'コイン'},{n:'10000PT',w:.91,pt:10000,i:'💎',v:'10,000',u:'PT'},{n:'倍倍チケット',w:.09,tk:1,i:'🎟',v:'倍倍',u:'チケット'}];
let D={s:[],k:[],left:0,over:false,busy:false,rolling:{}};
function calc(){const g={};D.s.forEach(x=>g[x.n]=(g[x.n]||0)+1);let coin=0,pt=0,tk=0,lines=[];
for(const n in g){const k=g[n],x=P.find(p=>p.n==n),u=k*k;if(x.c)coin+=x.c*u;if(x.pt)pt+=x.pt*u;if(x.tk)tk+=u;lines.push(`${n} ${k}個一致 → ${k}倍×${k}個＝${u}個`)}
return{coin,pt,tk,lines,mx:Math.max(...Object.values(g))}}
function drawStar(){$('#left').textContent=D.left;$('#spin').disabled=D.busy||D.over||D.left<1;$('#stop').disabled=D.busy||D.over;
$('#star').innerHTML=D.s.map((x,i)=>{const a=(-90+72*i)*Math.PI/180;return `<div class="sl ${D.k[i]?'k':''} ${P.indexOf(x)>=3?'hi':''} ${D.rolling[i]?'rl':''}" style="left:${170+128*Math.cos(a)}px;top:${160+120*Math.sin(a)}px" onclick="keep(${i})"><i>${x.i}</i><b>${x.v}</b><small>${x.u}</small></div>`}).join('');
const c=calc();$('#tot').innerHTML=D.rolling&&Object.keys(D.rolling).length?'🎰 SPIN中…':`合計 🪙${fmt(c.coin)}${c.pt?` 💎${fmt(c.pt)}PT`:''}${c.tk?` 🎟×${c.tk}`:''}`}
function keep(i){if(D.over||D.busy)return;D.k[i]=D.k[i]?0:1;SF.stop(2);drawStar()}
async function rollSlots(t){D.busy=true;const ns=D.s.slice();t.forEach(i=>{ns[i]=roll(P);D.rolling[i]=1});
const iv=setInterval(()=>{t.forEach(i=>{if(D.rolling[i])D.s[i]=P[Math.random()*6|0]});drawStar();SF.tick()},80);
for(let n=0;n<t.length;n++){await sleep(600+n*300);const i=t[n];D.s[i]=ns[i];delete D.rolling[i];SF.stop(n);anim($('#star').children[i]||$('#star'),'shk')}
clearInterval(iv);drawStar();
const rk=Math.max(...t.map(i=>P.indexOf(ns[i])));
if(rk==3)await celeb('10,000コイン！！','🪙 大当たり！',true);
if(rk==4)await celeb('10,000PT！！！','💎 超大当たり！！',true,1);
if(rk==5)await celeb('倍倍チャンスチケット！！！！','🌈🎟 超超激レア！！！！',true,1);
D.busy=false;drawStar()}
async function startDbl(){D={s:Array(5).fill(P[0]),k:[0,0,0,0,0],left:4,over:false,busy:true,rolling:{}};$('#d-ready').style.display='none';$('#d-play').style.display='';$('#d-end').style.display='none';drawStar();await rollSlots([0,1,2,3,4])}
async function spin(){if(D.busy||D.over||D.left<1)return;const t=[0,1,2,3,4].filter(i=>!D.k[i]);
if(!t.length){alert('keepを外してからSPINしてください');return}
D.left--;SF.whoosh();await rollSlots(t);if(D.left==0)setTimeout(finishDbl,600)}
async function finishDbl(){if(D.over||D.busy)return;D.over=true;drawStar();
const c=calc();c.lines.length&&0;
if(c.coin)addCard({type:'coin',name:'倍倍チャンス報酬',coin:c.coin});
S.pt+=c.pt;S.dt+=c.tk;save();
const M=c.mx==5;await celeb(M?'COMPLETE!!':`+${fmt(c.coin)}コイン`,(M?`<div style="font-size:26px;font-weight:900;color:#ffd43b">5つ全部そろった！！ ×25</div>+${fmt(c.coin)}コイン<br>`:'')+(c.pt?`+${fmt(c.pt)}PT<br>`:'')+(c.tk?`倍倍チケット+${c.tk}枚<br>`:'')+c.lines.join('<br>')+(c.coin?'<br>🎴 コインカードをカード一覧に追加':''),true,M?3:c.mx>=4?1:0);
$('#d-end').style.display=''}

let mi=0;setInterval(()=>{const e=$('#mult');if(e&&$('#d-ready').style.display!='none'){mi=(mi+1)%4;e.textContent='×'+(mi+2)}},900);
load();render();$('#mt').textContent=mute?'🔇 音OFF':'🔊 音ON';addEventListener('pageshow',()=>{load();render()});addEventListener('focus',()=>{load();render()});document.addEventListener('pointerdown',ac);
</script></body></html>
